[project]
name = "densitometry-backend"
version = "0.1.0"
description = "Densitometry AI — API сервиса контроля качества DXA"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
